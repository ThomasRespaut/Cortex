name: Core checks

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

jobs:
  local-core:
    name: Local core tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Raspberry Pi launcher shell syntax
        run: |
          bash -n scripts/launch_raspberry_pi.sh
          bash -n scripts/setup_raspberry_pi.sh
          bash -n deploy/raspberry-pi/install_service.sh

      - name: Install Pygame smoke dependency
        run: python -m pip install pygame==2.6.1

      - name: Run local validation chain
        run: python tools/run_local_checks.py --project-root . --screen-size 480x480
